version: '3.9'

# TourPilot Dashboard — docker-compose minimal
# Usa SQLite (sem serviço de banco separado).
# Para usar PostgreSQL, edite prisma/schema.prisma e adicione um serviço `db` aqui.

services:
  app:
    build: .
    container_name: tourpilot-dashboard
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: 'file:/app/data/dev.db'
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
    volumes:
      - tourpilot-data:/app/data

volumes:
  tourpilot-data:
